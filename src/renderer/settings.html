<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>Network Map Tray Settings</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; font-size: 14px; letter-spacing: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: Canvas; color: CanvasText; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    header img { width: 28px; height: 28px; object-fit: contain; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; min-width: 0; }
    .connection-row { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 16px; }
    input, select, button { min-height: 34px; font: inherit; border: 1px solid ButtonBorder; border-radius: 4px; }
    input, select { width: 100%; min-width: 0; padding: 6px 8px; background: Field; color: FieldText; }
    button { min-width: 80px; padding: 6px 16px; background: ButtonFace; color: ButtonText; cursor: pointer; }
    button:hover { filter: brightness(0.95); }
    button:disabled { cursor: default; opacity: 0.6; }
    :focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
    .primary { background: Highlight; color: HighlightText; border-color: Highlight; }
    #error { min-height: 36px; margin: 0; line-height: 18px; overflow-wrap: anywhere; }
    footer { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid ButtonBorder; padding-top: 16px; }
  </style>
  <script src="settings.js" defer></script>
</head>
<body>
  <header>
    <img src="../assets/icons/trayIcon-green.png" alt="" />
    <h1>Map connection</h1>
  </header>
  <form id="settings-form">
    <label for="host">Host
      <input type="text" id="host" required autocomplete="off" spellcheck="false" autofocus />
    </label>
    <div class="connection-row">
      <label for="protocol">Protocol
        <select id="protocol">
          <option value="https">HTTPS</option>
          <option value="http">HTTP</option>
        </select>
      </label>
      <label for="port">Port
        <input type="number" id="port" required min="1" max="65535" step="1" />
      </label>
    </div>
    <p id="error" role="alert"></p>
    <footer>
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" id="save" class="primary" disabled>Save</button>
    </footer>
  </form>
</body>
</html>
